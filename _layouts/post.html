---
layout: default
---
<article class="wrap post" data-calculator-url="{{ page.calculator_url | relative_url }}" data-calculator-name="{{ page.calculator_name }}" data-calculator-heading="{{ page.calculator_heading }}" data-calculator-note="{{ page.calculator_note | default: '' }}">
  <div class="reading-progress" aria-hidden="true"><span id="readingProgressBar"></span></div>
  <header class="post-hero">
    <p class="crumb"><a href="{{ '/' | relative_url }}">Home</a> / <a href="{{ '/blog/' | relative_url }}">Guides</a> / {{ page.title }}</p>
    <div class="post-hero-grid">
      <div class="post-hero-text">
        <p class="post-kicker">{{ page.guide_category | default: "Cost Guide" }}</p>
        <h1>{{ page.title }}</h1>
        <div class="post-byline">
          <span class="post-avatar" aria-hidden="true">$</span>
          <div class="post-byline-text">
            <span class="post-author">How Much Does It Cost USA Team</span>
            <span class="post-date">Published {{ page.date | date: "%B %-d, %Y" }}</span>
          </div>
        </div>
        <div class="share-row">
          <span class="share-label">Share</span>
          <a class="share-btn" href="https://twitter.com/intent/tweet?url={{ page.url | absolute_url | url_encode }}&amp;text={{ page.title | url_encode }}" target="_blank" rel="noopener" aria-label="Share on X"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231 5.451-6.231zm-1.161 17.52h1.833L7.084 4.126H5.117l11.966 15.644z"/></svg></a>
          <a class="share-btn" href="https://www.facebook.com/sharer/sharer.php?u={{ page.url | absolute_url | url_encode }}" target="_blank" rel="noopener" aria-label="Share on Facebook"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg></a>
          <button type="button" class="share-btn share-copy" data-copy-url="{{ page.url | absolute_url }}"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg><span>Copy link</span></button>
        </div>
      </div>
    </div>
    {% if page.image %}
    <img class="post-hero-img" src="{{ page.image | relative_url }}" srcset="{{ page.image_card | relative_url }} 800w, {{ page.image | relative_url }} 1200w" sizes="(max-width: 760px) 100vw, 1200px" width="{{ page.image_w | default: 1200 }}" height="{{ page.image_h | default: 800 }}" alt="{{ page.image_alt }}" loading="lazy" decoding="async"{% if page.image_pos %} style="object-position: {{ page.image_pos }};"{% endif %}>
    {% endif %}
  </header>
  <div class="post-layout">
    <nav class="post-toc" id="postToc" aria-label="On this page">
      <p class="post-toc-title">On this page</p>
      <ol class="post-toc-list" id="postTocList"></ol>
    </nav>
    <div class="post-body">
      {{ content }}
    </div>
  </div>
  <div class="share-row share-row-bottom">
    <span class="share-label">Share this guide</span>
    <a class="share-btn" href="https://twitter.com/intent/tweet?url={{ page.url | absolute_url | url_encode }}&amp;text={{ page.title | url_encode }}" target="_blank" rel="noopener" aria-label="Share on X"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231 5.451-6.231zm-1.161 17.52h1.833L7.084 4.126H5.117l11.966 15.644z"/></svg></a>
    <a class="share-btn" href="https://www.facebook.com/sharer/sharer.php?u={{ page.url | absolute_url | url_encode }}" target="_blank" rel="noopener" aria-label="Share on Facebook"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg></a>
    <button type="button" class="share-btn share-copy" data-copy-url="{{ page.url | absolute_url }}"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg><span>Copy link</span></button>
  </div>
</article>
