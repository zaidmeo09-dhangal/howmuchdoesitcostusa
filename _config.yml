# How Much Does It Cost USA - Jekyll configuration
# LIVE on https://howmuchdoesitcostusa.com since Nov 21, 2026.
# url/baseurl point at the custom domain.
title: How Much Does It Cost USA
description: "Find what things cost in the USA with free cost calculators and guides for movers, roofing, fences, oil changes, AC, car wraps, and painting."
url: "https://howmuchdoesitcostusa.com"
baseurl: ""
future: true

# Blog posts get /blog/slug/ URLs automatically
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      permalink: "/blog/:title/"

# Build settings
markdown: kramdown
plugins:
  - jekyll-sitemap

# Exclude from build
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
